<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>ESP32 Live GPS Tracker</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
    }
    #map {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script type="module">
    /* =======================
       FIREBASE CONFIG
    ======================== */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDiUvCN_eHgHLBC2HFNeanIWAbOb50PMvs",
      authDomain: "esp32-gps-tracker-61551.firebaseapp.com",
      databaseURL: "https://esp32-gps-tracker-61551-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "esp32-gps-tracker-61551",
      storageBucket: "esp32-gps-tracker-61551.firebasestorage.app",
      messagingSenderId: "1016123229948",
      appId: "1:1016123229948:web:42c0e4d99b9bc31f307979"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    /* =======================
       MAP SETUP
    ======================== */
    const map = L.map("map").setView([-6.1889, 106.2119], 17);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    }).addTo(map);

    // MARKER DIBUAT SEKALI SAJA
    const marker = L.marker([-6.1889, 106.2119]).addTo(map);

    /* =======================
       FIREBASE LISTENER
    ======================== */
    const gpsRef = ref(db, "gps");

    onValue(gpsRef, (snapshot) => {
      if (!snapshot.exists()) return;

      const data = snapshot.val();
      const lat = Number(data.lat);
      const lng = Number(data.lng);
      const speed = Number(data.speed);

      if (isNaN(lat) || isNaN(lng)) return;

      // 🔥 LIVE MOVING
      marker.setLatLng([lat, lng]);
      map.panTo([lat, lng]);

      marker.bindPopup(`
        <b>ESP32 GPS</b><br>
        Lat: ${lat}<br>
        Lng: ${lng}<br>
        Speed: ${speed} km/h
      `);
    });
  </script>
</body>
</html>
